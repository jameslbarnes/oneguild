            :root {
                --paper: #FBFAF7;
                --ink: #141310;
                --muted: #57524A;
                --faint: #8A8377;
                --hair: #DDD8CA;
                --gold: #C89B3C;
                --display: "InstrumentSerif", "Palatino", "Palatino Linotype", "Book Antiqua", Georgia, serif;
                --body: "Avenir Next", "Avenir", "Seravek", "Segoe UI", system-ui, sans-serif;
                --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, monospace;
            }

            * { box-sizing: border-box; }

            .staticrypt-html { height: 100%; background: var(--paper); }

            .staticrypt-body {
                height: 100%;
                margin: 0;
                font-family: var(--body);
                color: var(--ink);
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            .hidden { display: none !important; }

            /* ---------- loading ---------- */
            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .staticrypt-spinner {
                display: inline-block;
                width: 26px;
                height: 26px;
                border: 2px solid var(--hair);
                border-right-color: var(--gold);
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
            }
            @keyframes spin { 100% { transform: rotate(360deg); } }

            /* ---------- page ---------- */
            .staticrypt-content {
                min-height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 40px 24px;
                position: relative;
                overflow: hidden;
            }

            /* a stone dropped in still water */
            .ripple {
                position: absolute;
                left: 50%;
                top: 50%;
                pointer-events: none;
            }
            .ripple span {
                position: absolute;
                left: 0;
                top: 0;
                width: 12px;
                height: 12px;
                margin: -6px 0 0 -6px;
                border: 1px solid var(--hair);
                border-radius: 50%;
                opacity: 0;
                animation: ripple 9s linear infinite;
            }
            .ripple span:nth-child(2) { animation-delay: 3s; }
            .ripple span:nth-child(3) { animation-delay: 6s; }
            @keyframes ripple {
                0%   { transform: scale(1);  opacity: 0; }
                6%   { opacity: 0.55; }
                100% { transform: scale(70); opacity: 0; }
            }

            .gate {
                position: relative;
                width: 100%;
                max-width: 380px;
                text-align: center;
            }

            .eyebrow {
                font-family: var(--mono);
                font-size: 11px;
                letter-spacing: 0.32em;
                text-transform: uppercase;
                color: var(--faint);
                margin: 0 0 26px;
            }

            h1 {
                font-family: var(--display);
                font-weight: 400;
                font-size: clamp(38px, 9vw, 48px);
                line-height: 1.1;
                margin: 0 0 14px;
                color: var(--ink);
            }
            h1 em { font-style: italic; }
            h1 .under { border-bottom: 2px solid var(--gold); padding-bottom: 2px; }

            .staticrypt-instructions p.note {
                font-size: 14.5px;
                line-height: 1.6;
                color: var(--muted);
                margin: 0 0 40px;
            }

            /* ---------- form ---------- */
            .staticrypt-password-container {
                position: relative;
                margin: 0 0 22px;
                border-bottom: 1px solid var(--hair);
                transition: border-color 0.3s;
            }
            .staticrypt-password-container:focus-within { border-color: var(--gold); }

            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                width: 100%;
                background: transparent;
                border: 0;
                outline: 0;
                font-family: var(--body);
                font-size: 16px;
                color: var(--ink);
                padding: 12px 40px 12px 2px;
                text-align: left;
            }
            .staticrypt-form input::placeholder { color: var(--faint); opacity: 0.8; }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                position: absolute;
                right: 4px;
                top: 50%;
                transform: translateY(-50%);
                width: 17px;
                height: 17px;
                opacity: 0.35;
                transition: opacity 0.25s;
            }
            .staticrypt-toggle-password-visibility:hover { opacity: 0.7; }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
                font-family: var(--mono);
                font-size: 10.5px;
                letter-spacing: 0.18em;
                text-transform: uppercase;
                color: var(--faint);
                margin: 0 0 30px;
                cursor: pointer;
            }
            .staticrypt-remember input[type="checkbox"] {
                accent-color: var(--gold);
                width: 14px;
                height: 14px;
                margin: 0;
            }

            .staticrypt-decrypt-button {
                width: 100%;
                background: var(--ink);
                color: var(--paper);
                border: 1px solid var(--ink);
                padding: 15px;
                font-family: var(--mono);
                font-size: 11px;
                letter-spacing: 0.28em;
                text-transform: uppercase;
                cursor: pointer;
                transition: background 0.3s, border-color 0.3s;
            }
            .staticrypt-decrypt-button:hover,
            .staticrypt-decrypt-button:focus-visible {
                background: var(--gold);
                border-color: var(--gold);
            }

            .gate-error {
                font-family: var(--mono);
                font-size: 11px;
                letter-spacing: 0.14em;
                text-transform: uppercase;
                color: #9a3b22;
                margin: 18px 0 0;
                min-height: 14px;
            }

            .gate-foot {
                font-family: var(--mono);
                font-size: 10px;
                letter-spacing: 0.22em;
                text-transform: uppercase;
                color: var(--faint);
                margin-top: 60px;
                opacity: 0.8;
            }

            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                20% { transform: translateX(-7px); }
                40% { transform: translateX(6px); }
                60% { transform: translateX(-4px); }
                80% { transform: translateX(3px); }
            }
            .shake { animation: shake 0.45s ease; }

            @media (prefers-reduced-motion: reduce) {
                .ripple span { animation: none; }
                .shake { animation: none; }
                .staticrypt-spinner { animation-duration: 1.5s; }
            }
        </style>
    </head>
