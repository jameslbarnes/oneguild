<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#141310"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C89B3C"/>
    </marker>
    <linearGradient id="grad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#C89B3C" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#C89B3C" stop-opacity="0.55"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, "SF Mono", Menlo, "Source Code Pro", monospace; font-size: 11.5px; }
      .h { font-size: 26px; fill: #141310; }
      .sub { font-size: 12.5px; fill: #57524A; }
      .cap { font-size: 12px; fill: #8A8377; letter-spacing: 0.08em; text-transform: uppercase; }
      .lbl { font-size: 13px; fill: #57524A; font-style: italic; }
      .box { fill: #FBFAF7; stroke: #141310; stroke-width: 1.25; }
      .band { fill: #FBFAF7; stroke: #DDD8CA; stroke-width: 1; }
      .vbox { fill: #FFFFFF; stroke: #141310; stroke-width: 1.25; }
      .flow { fill: none; stroke: #141310; stroke-width: 1.25; marker-end: url(#arr); }
      .flowg { fill: none; stroke: #C89B3C; stroke-width: 1.5; marker-end: url(#arrg); }
    </style>
  </defs>

  <rect width="1200" height="900" fill="#FBFAF7"/>

  <!-- title -->
  <text x="600" y="48" text-anchor="middle" class="mono cap">The flywheel · talent, capital, infrastructure</text>

  <!-- ===== INFRASTRUCTURE ROW ===== -->
  <text x="600" y="92" text-anchor="middle" class="mono cap">Infrastructure</text>

  <!-- School -->
  <rect x="110" y="110" width="280" height="96" rx="2" class="box"/>
  <text x="250" y="148" text-anchor="middle" class="h">School</text>
  <text x="250" y="170" text-anchor="middle" class="sub">25 Dobbin St · 28,000 sq ft on McCarren Park</text>
  <text x="250" y="190" text-anchor="middle" class="sub mono">$100k YTD → $1M ARR · 18 mo</text>

  <!-- Network State -->
  <rect x="810" y="110" width="280" height="96" rx="2" class="box"/>
  <text x="950" y="148" text-anchor="middle" class="h">Network State</text>
  <text x="950" y="170" text-anchor="middle" class="sub">School, multiplied · one community per node</text>
  <text x="950" y="190" text-anchor="middle" class="sub mono">2 new nodes · 18 mo</text>

  <!-- Network State -> School (closing the loop, leftward along top) -->
  <path d="M810 158 L392 158" class="flow"/>
  <text x="600" y="150" text-anchor="middle" class="lbl">each new node is another School</text>

  <!-- ===== TALENT (left) ===== -->
  <text x="190" y="372" text-anchor="middle" class="mono cap">Talent</text>
  <rect x="40" y="388" width="300" height="104" rx="2" class="box"/>
  <text x="190" y="426" text-anchor="middle" class="h">Membership</text>
  <text x="190" y="448" text-anchor="middle" class="sub">selected for values, craft, and growth</text>
  <text x="190" y="468" text-anchor="middle" class="sub mono">4 founding → 150 cap · >$500k ARR</text>

  <!-- School -> Membership -->
  <path d="M250 206 L250 386" class="flow"/>
  <text x="262" y="300" class="lbl">place attracts people</text>

  <!-- ===== CAPITAL (right) ===== -->
  <text x="1010" y="372" text-anchor="middle" class="mono cap">Capital</text>
  <rect x="860" y="388" width="300" height="104" rx="2" class="box"/>
  <text x="1010" y="426" text-anchor="middle" class="h">Unlimited Partners</text>
  <text x="1010" y="448" text-anchor="middle" class="sub">patrons and the Guild’s economic engine</text>
  <text x="1010" y="468" text-anchor="middle" class="sub mono">dividends · exits · guild liquidity</text>

  <!-- ULP -> Network State : surplus opens nodes -->
  <path d="M950 386 L950 208" class="flow"/>
  <text x="962" y="300" class="lbl">surplus opens new nodes</text>

  <!-- ===== HUB: LOONSHOTS ===== -->
  <circle cx="600" cy="440" r="86" fill="#FBFAF7" stroke="#C89B3C" stroke-width="1.75"/>
  <circle cx="600" cy="440" r="78" fill="none" stroke="#C89B3C" stroke-width="0.75" stroke-dasharray="2 4"/>
  <text x="600" y="436" text-anchor="middle" class="h" style="fill:#C89B3C">Loonshots</text>
  <text x="600" y="458" text-anchor="middle" class="sub">two or more guild companies</text>
  <text x="600" y="474" text-anchor="middle" class="sub">on a problem neither can solve alone</text>

  <!-- hub spokes (faint) -->
  <path d="M600 354 L600 240" stroke="#C89B3C" stroke-width="0.75" stroke-dasharray="2 4" fill="none"/>
  <path d="M514 440 L342 440" stroke="#C89B3C" stroke-width="0.75" stroke-dasharray="2 4" fill="none"/>
  <path d="M686 440 L858 440" stroke="#C89B3C" stroke-width="0.75" stroke-dasharray="2 4" fill="none"/>
  <path d="M600 526 L600 572" stroke="#C89B3C" stroke-width="0.75" stroke-dasharray="2 4" fill="none"/>

  <!-- ===== VEHICLES BAND ===== -->
  <text x="600" y="588" text-anchor="middle" class="mono cap">Capital vehicles</text>
  <rect x="110" y="604" width="980" height="190" rx="2" class="band"/>

  <!-- Membership -> band -->
  <path d="M190 492 L190 602" class="flow"/>
  <text x="202" y="552" class="lbl">members surface and build companies</text>

  <!-- ULP -> band (funds) and band -> ULP (returns) -->
  <path d="M985 492 L985 602" class="flow"/>
  <text x="997" y="540" class="lbl">funds</text>
  <path d="M1035 602 L1035 494" class="flowg"/>
  <text x="1047" y="552" class="lbl" style="fill:#C89B3C">exits · dividends · tokens</text>

  <!-- four vehicle boxes -->
  <g>
    <rect x="130" y="624" width="220" height="118" rx="2" class="vbox"/>
    <text x="240" y="656" text-anchor="middle" class="h" style="font-size:22px">Scout Fund</text>
    <text x="240" y="680" text-anchor="middle" class="sub mono">$50k per member</text>
    <text x="240" y="698" text-anchor="middle" class="sub mono">AI interview · agentic eval</text>
    <text x="240" y="724" text-anchor="middle" class="sub mono">$1M deployed · 18 mo</text>
  </g>
  <g>
    <rect x="370" y="624" width="220" height="118" rx="2" class="vbox"/>
    <text x="480" y="656" text-anchor="middle" class="h" style="font-size:22px">Cooperative</text>
    <text x="480" y="680" text-anchor="middle" class="sub mono">$500k–1M · 5–10%</text>
    <text x="480" y="698" text-anchor="middle" class="sub mono">half invested · half common</text>
    <text x="480" y="724" text-anchor="middle" class="sub mono">10 cos · >$5M ARR · 18 mo</text>
  </g>
  <g>
    <rect x="610" y="624" width="220" height="118" rx="2" class="vbox"/>
    <text x="720" y="656" text-anchor="middle" class="h" style="font-size:22px">Studio</text>
    <text x="720" y="680" text-anchor="middle" class="sub mono">majority owned · EIR led</text>
    <text x="720" y="698" text-anchor="middle" class="sub mono">ETHEREA · Hohm · next</text>
    <text x="720" y="724" text-anchor="middle" class="sub mono">4 cos · >$2M ARR · 18 mo</text>
  </g>
  <g>
    <rect x="850" y="624" width="220" height="118" rx="2" class="vbox"/>
    <text x="960" y="656" text-anchor="middle" class="h" style="font-size:22px">Growth Fund</text>
    <text x="960" y="680" text-anchor="middle" class="sub mono">later-stage follow-on</text>
    <text x="960" y="698" text-anchor="middle" class="sub mono">ecosystem partners</text>
    <text x="960" y="724" text-anchor="middle" class="sub mono">—</text>
  </g>

  <!-- progression arrows between boxes -->
  <path d="M350 683 L368 683" class="flowg"/>
  <path d="M590 683 L608 683" class="flowg"/>
  <path d="M830 683 L848 683" class="flowg"/>

  <!-- gradient bar -->
  <rect x="130" y="758" width="940" height="10" fill="url(#grad)"/>
  <text x="130" y="786" class="mono cap" style="text-anchor:start">ownership · check size · company stage</text>
  <text x="1070" y="786" class="mono cap" style="text-anchor:end">→</text>

  <!-- footer -->
  <text x="600" y="856" text-anchor="middle" class="sub">Place attracts people. People build companies. Capital backs them. Returns open the next node.</text>
</svg>
